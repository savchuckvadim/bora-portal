server_name: "matrix.local"
pid_file: /data/homeserver.pid
public_baseurl: "http://localhost:8008/"
listeners:
  - type: http
    port: 8008
    tls: false
    x_forwarded: false
    resources:
      - names: [client, federation]
        compress: false

database:
  name: psycopg2
  args:
    user: synapse
    password: synapse
    database: synapse
    host: postgres-matrix
    cp_min: 5
    cp_max: 10

log_config: "/data/matrix.local.log.config"
media_store_path: /data/media_store
registration_shared_secret: "replace-me-registration-secret"
macaroon_secret_key: "replace-me-macaroon-secret"
form_secret: "replace-me-form-secret"
signing_key_path: "/data/matrix.local.signing.key"
trusted_key_servers:
  - server_name: "matrix.org"

enable_registration: false
enable_registration_without_verification: false

oidc_providers:
  - idp_id: keycloak
    idp_name: Keycloak
    issuer: "http://keycloak:8080/realms/bora"
    client_id: "matrix"
    client_secret: "matrix-client-secret"
    scopes: ["openid", "profile", "email"]
    user_mapping_provider:
      config:
        localpart_template: "{{ user.preferred_username }}"
        display_name_template: "{{ user.name }}"
